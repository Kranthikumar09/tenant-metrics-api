<div class="shell">
	<header>
		<p class="brand">Churn Intelligence</p>
		<nav>
			<a routerLink="/onboarding" routerLinkActive="active">Onboarding</a>
			<a routerLink="/risk" routerLinkActive="active">Risk</a>
		</nav>
		<div class="session-actions">
			<button
				type="button"
				(click)="signOut()"
				[disabled]="logoutStatus().status === 'pending'"
			>
				@if (logoutStatus().status === 'pending') {
					Signing out…
				} @else {
					Sign out
				}
			</button>
			<p class="session-status" aria-live="polite">
				@if (logoutStatus().status === 'signed-out') {
					Signed out securely.
				} @else if (logoutStatus().status === 'error') {
					{{ logoutStatus().message }}
				}
			</p>
		</div>
	</header>
	<main>
		<router-outlet />
	</main>
</div>
